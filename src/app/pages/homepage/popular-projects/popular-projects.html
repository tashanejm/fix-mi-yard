<div class="flex justify-between items-center mb-4">
  <h2 class="text-2xl font-bold">{{'page.homepage.fields.popularProjects' | translate}}</h2>
  <div class="flex justify-end gap-x-2">
    <button pButton pRipple type="button" [text]="true" [rounded]="true" (click)="carousel.navBackward($event)">
      <i pButtonIcon class="material-symbols-outlined">{{materialSymbols.CHEVRON_LEFT}}</i>
    </button>
    <button pButton pRipple type="button" [text]="true" [rounded]="true" (click)="carousel.navForward($event)">
      <i pButtonIcon class="material-symbols-outlined">{{materialSymbols.CHEVRON_RIGHT}}</i>
    </button>
  </div>
</div>
<div>
  <p-carousel #carousel [value]="projects()" [numVisible]="5" [numScroll]="1" [responsiveOptions]="responsiveOptions()" [autoplayInterval]="5000" [showNavigators]="false" [showIndicators]="false" [circular]="true">
    <ng-template #item let-project>
        <p-card class="block m-2 h-full" [dt]="designToken.card">
          <div class="relative w-full h-48 mb-4 overflow-hidden rounded-t-2xl">
            <img class="object-cover" fill [alt]="project.value.description" [ngSrc]="project.value.image"/>
          </div>
          <div class="flex flex-col w-full justify-center items-center px-4 pb-4">
            <span class="font-bold text-lg mb-1 text-center">{{project.label}}</span>
            <span class="text-sm text-center text-gray-600 dark:text-gray-300">{{project.value.description}}</span>
          </div>
        </p-card>
    </ng-template>
  </p-carousel>
</div>
