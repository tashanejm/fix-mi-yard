<div class="flex flex-col w-full">
  <div class="search-background-image w-full flex items-center">
    <p-card class="w-[70vw] md:w-[40vw]">
      <ng-template #title>
        <span>{{'page.homepage.fields.topRatedCertifiedProsInYourArea' | translate}}</span>
      </ng-template>
      <app-search-criteria [(value)]="selection"/>
    </p-card>
  </div>
  <div class="flex flex-col px-16 py-8 gap-4">
    <app-quick-selection (selectionChange)="onSelectionChane($event)"/>
    <app-popular-projects/>
    <app-articles-and-advice/>
  </div>
</div>
